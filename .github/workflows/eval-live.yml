name: Live evaluation (manual)

# Genuine model inference on a GitHub-hosted CPU runner (free for public
# repositories). Manually triggered only; bounded subset; no secrets, no paid
# APIs, no LLM judge. Results are uploaded as an artifact and labelled
# "development" — they are not official benchmark results.

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Case tags to run"
        default: "ci_subset"
      modes:
        description: "Modes (standard,agentic)"
        default: "standard,agentic"
      repeats:
        description: "Repeats"
        default: "1"
      model:
        description: "Ollama model"
        default: "llama3.2:3b"
      run_verifier_challenge:
        description: "Also run the verifier challenge set"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-msmarco-v1
      - name: Install Ollama (official installer)
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.model }}
      - name: Start Ollama and pull the model
        run: |
          ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          ollama pull "${{ inputs.model }}"
          ollama --version
      - name: Run evaluation subset
        run: |
          /usr/bin/time -v python -m evals run --out eval-out --label development \
            --tags "${{ inputs.tags }}" --modes "${{ inputs.modes }}" \
            --repeats "${{ inputs.repeats }}" --model "${{ inputs.model }}" 2> time.log
          grep -E "Elapsed|Maximum resident" time.log || true
      - name: Verifier challenge set
        if: ${{ inputs.run_verifier_challenge }}
        run: python -m evals verifier --out eval-out/verifier.json --model "${{ inputs.model }}"
      - name: Job summary
        if: always()
        run: |
          echo "## Live evaluation (CPU runner, development subset)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Elapsed|Maximum resident" time.log >> "$GITHUB_STEP_SUMMARY" || true
          [ -f eval-out/report.md ] && cat eval-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ github.run_id }}
          path: |
            eval-out
            !eval-out/index
            !eval-out/original_*
            ollama.log
            time.log
          retention-days: 30
