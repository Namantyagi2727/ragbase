[theme]
base                  = "dark"
backgroundColor       = "#03050e"
secondaryBackgroundColor = "#0a1020"
primaryColor          = "#00d4ff"
textColor             = "#c8dfe8"
font                  = "sans serif"

[server]
headless = false

# showcase-deploy branch: the public showcase has no upload widget and never
# reads uploads; this caps what Streamlit's upload endpoint will accept into
# session memory (it is a cap, not a prohibition). main keeps 50 MB for the
# full local app. See docs/DEPLOYMENT.md.
maxUploadSize = 1

[browser]
# Do not send Streamlit usage statistics (local app and public showcase).
gatherUsageStats = false
